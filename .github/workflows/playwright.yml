name: Playwright Tests
on:
  push:
    branches: [main]
  # Called by the "Pull request" workflow, which gates the APK/IPA builds behind
  # these jobs. Running on `pull_request` as well would duplicate every PR run.
  workflow_call:
permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    name: "Playwright Tests"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install ${{ github.actor == 'dependabot[bot]' && '--no-frozen-lockfile' || '--frozen-lockfile' }}

      - name: Run Playwright tests
        run: pnpm run testing:ci

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: ./testing/playwright-report/
          retention-days: 30
