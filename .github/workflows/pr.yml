name: Pull request

on:
  pull_request:
    branches:
      - main

# One run per PR: pushing again supersedes the run in flight. macOS runners are
# the scarcest ones, so nothing redundant should ever sit in the queue.
concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

# Reusable workflows cannot ask for more than their caller grants, so this is the
# ceiling for the called jobs too. Nothing here needs to write.
permissions:
  contents: read

jobs:
  # oxlint + oxfmt, from their own workflow so `push` on main keeps running them.
  quality:
    uses: ./.github/workflows/oxlint.yml

  test:
    uses: ./.github/workflows/playwright.yml

  # The two builds are the expensive half of the PR (Gradle, and a macOS runner
  # for Xcode). `needs` is a hard gate: a red lint, a bad format or a failing
  # Playwright run means they are never started, so a broken PR costs minutes
  # instead of a full build matrix.
  apk:
    name: Build Signed APK
    needs: [quality, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set VITE_CURRENT_VERSION
        run: echo "VITE_CURRENT_VERSION=v0.0.0-testing" >> $GITHUB_ENV

      - name: Set VERSION_CODE
        # A timestamp keeps versionCode strictly increasing across PR builds so
        # Android allows installing over an existing release without requiring
        # an uninstall first (Android rejects installs with a lower versionCode).
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "VERSION_CODE=$(date +%s)" >> $GITHUB_ENV
          echo "VERSION_NAME=0.0.0-pr${PR_NUMBER}" >> $GITHUB_ENV

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Setup build tool version variable
        shell: bash
        run: |
          BUILD_TOOL_VERSION=$(ls /usr/local/lib/android/sdk/build-tools/ | tail -n 1)
          echo "BUILD_TOOL_VERSION=$BUILD_TOOL_VERSION" >> $GITHUB_ENV
          echo Last build tool version is: $BUILD_TOOL_VERSION

      - name: Install app dependencies
        run: pnpm install ${{ github.actor == 'dependabot[bot]' && '--no-frozen-lockfile' || '--frozen-lockfile' }}

      - name: Build project app
        run: pnpm run build

      - name: Capacitor copy
        run: npx cap copy android

      - name: Capacitor update
        run: npx cap update android

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Make gradlew executable
        working-directory: ./android
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Execute Gradle build
        working-directory: ./android
        run: ./gradlew build --scan

      - name: Sign APK
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KS_PASS: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > /tmp/keystore.jks
          $ANDROID_SDK_ROOT/build-tools/$BUILD_TOOL_VERSION/apksigner sign \
            --ks /tmp/keystore.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KS_PASS" \
            --key-pass "pass:$KEY_PASS" \
            --out android/app/build/outputs/apk/release/shazarr-signed.apk \
            android/app/build/outputs/apk/release/app-release-unsigned.apk
          rm /tmp/keystore.jks

      - name: Upload app apk as artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-bundle
          path: android/app/build/outputs/apk/release/shazarr-signed.apk

  ipa:
    name: Build unsigned IPA
    needs: [quality, test]
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set VITE_CURRENT_VERSION
        run: echo "VITE_CURRENT_VERSION=v0.0.0-testing" >> $GITHUB_ENV

      - name: Set version env vars
        # A timestamp keeps CFBundleVersion strictly increasing across PR builds,
        # which is what sideloaders (SideStore, AltStore) compare to offer an
        # update rather than a reinstall.
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "CURRENT_PROJECT_VERSION=$(date +%s)" >> $GITHUB_ENV
          echo "MARKETING_VERSION=0.0.0-pr${PR_NUMBER}" >> $GITHUB_ENV

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "pnpm"

      - name: Install app dependencies
        run: pnpm install ${{ github.actor == 'dependabot[bot]' && '--no-frozen-lockfile' || '--frozen-lockfile' }}

      - name: Build project app
        run: pnpm run build

      # `copy` only, deliberately not `sync`/`update`: those rewrite the Podfile
      # from the resolved plugin paths, so the build would no longer test the
      # Podfile we actually commit.
      - name: Capacitor copy
        run: pnpm exec cap copy ios

      # --deployment forbids touching Podfile.lock, so this goes red whenever the
      # committed lock has drifted from the committed Podfile instead of silently
      # repairing it. That drift is what broke iOS builds in issue #385, and what
      # a dependabot bump of @capacitor/* reintroduces if nothing checks it.
      - name: Install pods from committed lockfile
        working-directory: ./ios/App
        run: pod install --deployment

      # MARKETING_VERSION / CURRENT_PROJECT_VERSION are hardcoded to 1.0 / 1 in
      # project.pbxproj, so they are overridden here.
      - name: Build unsigned Release app
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme Shazarr \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios \
            -quiet \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$CURRENT_PROJECT_VERSION" \
            build

      # xcodebuild can exit 0 while erroring out and producing nothing, so assert
      # the bundle exists rather than trusting the exit code.
      - name: Verify app bundle was produced
        run: test -d build/ios/Build/Products/Release-iphoneos/Shazarr.app

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          mkdir -p build/ipa/Payload
          cp -R build/ios/Build/Products/Release-iphoneos/Shazarr.app build/ipa/Payload/
          cd build/ipa
          zip -qry ../shazarr-unsigned.ipa Payload

      - name: Verify IPA contents
        run: |
          set -euo pipefail
          # A Capacitor app without its web assets installs but shows a blank screen.
          unzip -l build/shazarr-unsigned.ipa | grep -q 'Payload/Shazarr.app/public/index.html'
          unzip -l build/shazarr-unsigned.ipa | grep -q 'Payload/Shazarr.app/Frameworks/Capacitor.framework/Capacitor'
          unzip -l build/shazarr-unsigned.ipa | grep -q 'Payload/Shazarr.app/capacitor.config.json'
          ls -lh build/shazarr-unsigned.ipa

      - name: Upload IPA as artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-ipa
          path: build/shazarr-unsigned.ipa
