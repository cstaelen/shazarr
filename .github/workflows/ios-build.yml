name: iOS Build

# No `paths:` filter on the triggers: a workflow skipped by path filtering never
# reports its checks, so a required status check from it would leave every PR
# pending forever. Instead the trigger is unconditional and the expensive macOS
# job is gated by a job-level `if:` — a job skipped that way reports as success.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    name: Detect iOS changes
    runs-on: ubuntu-latest
    outputs:
      ios: ${{ steps.filter.outputs.ios }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whether anything iOS-relevant changed
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "Not a pull request — building."
            echo "ios=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE_SHA" HEAD)
          echo "Changed files:"; echo "$changed"
          if echo "$changed" | grep -qE '^(ios/|package\.json$|pnpm-lock\.yaml$|capacitor\.config\.ts$|\.npmrc$|\.github/workflows/ios-build\.yml$)'; then
            echo "ios=true" >> "$GITHUB_OUTPUT"
          else
            echo "ios=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build iOS app
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install ${{ github.actor == 'dependabot[bot]' && '--no-frozen-lockfile' || '--frozen-lockfile' }}

      - name: Build web assets
        run: pnpm run build

      # `copy` only, deliberately not `sync`/`update`: those rewrite the Podfile
      # from the resolved plugin paths, so the build would no longer test the
      # Podfile we actually commit.
      - name: Capacitor copy
        run: pnpm exec cap copy ios

      # --deployment forbids touching Podfile.lock, so this goes red whenever the
      # committed lock has drifted from the committed Podfile instead of silently
      # repairing it. That drift is what broke iOS builds in issue #385.
      - name: Install pods from committed lockfile
        working-directory: ./ios/App
        run: pod install --deployment

      # The real compile: catches deployment-target and Swift breakage. Device
      # destination rather than simulator: it needs no simulator runtime, so the
      # job does not break when the runner's Xcode and CoreSimulator versions
      # drift apart, and it builds arm64 only instead of arm64+x86_64.
      - name: Build for device (unsigned)
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme Shazarr \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios \
            -quiet \
            CODE_SIGNING_ALLOWED=NO \
            build

      # xcodebuild can exit 0 while erroring out and producing nothing, so assert
      # the bundle exists rather than trusting the exit code.
      - name: Verify app bundle was produced
        run: test -d build/ios/Build/Products/Debug-iphoneos/Shazarr.app
